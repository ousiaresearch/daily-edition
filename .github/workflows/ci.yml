name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: python -m pip install --quiet --upgrade pip fastapi pydantic pyyaml
      - name: Python tests
        run: python -m unittest discover -s tests -v

  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Edition model
        run: node --test tests/edition.test.mjs
      - name: Desktop render harness
        run: node tests/desktop.mjs

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Plugin contract
        run: |
          if command -v hermes >/dev/null 2>&1; then
            hermes plugins validate .
          else
            # The manifest checks in the python job cover the contract without the CLI; the
            # security scan only runs where Hermes is installed.
            echo "hermes CLI not on PATH — manifest checks ran in the python job."
          fi
